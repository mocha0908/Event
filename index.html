<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>イベント・チケ管理アプリ</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen p-4 md:p-8 text-gray-800">

  <div class="max-w-6xl mx-auto">
    <header class="mb-8 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b border-gray-200 pb-5">
      <div>
        <h1 class="text-2xl font-bold text-gray-900 tracking-tight">📅 イベント・チケ管理</h1>
        <p class="text-xs text-gray-500 mt-1">締切間近のイベントを最優先で自動ソートします</p>
      </div>
      <div class="flex space-x-2 w-full sm:w-auto">
        <button onclick="toggleForm()" class="flex-1 sm:flex-none bg-green-600 hover:bg-green-700 text-white px-5 py-2.5 rounded-lg shadow-sm transition font-semibold text-sm">
          ＋ イベント追加
        </button>
        <button onclick="fetchEvents()" class="flex-1 sm:flex-none bg-white hover:bg-gray-50 text-gray-700 px-5 py-2.5 rounded-lg shadow-sm transition border border-gray-300 font-semibold text-sm">
          🔄 更新
        </button>
      </div>
    </header>

    <div id="add-form-container" class="hidden bg-white p-6 rounded-xl shadow-md border border-gray-200 mb-8 max-w-2xl mx-auto transition-all">
      <h2 class="text-base font-bold text-gray-900 mb-4 flex items-center">🆕 新しいイベントの追加</h2>
      <form id="add-event-form" onsubmit="addEvent(event)" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-bold text-gray-600 mb-1">開催日 *</label>
          <input type="date" name="開催日" required class="w-full border border-gray-300 p-2 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-600 mb-1">イベント名 *</label>
          <input type="text" name="イベント名" required class="w-full border border-gray-300 p-2 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="ライブ・公演名">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-600 mb-1">会場</label>
          <input type="text" name="会場" class="w-full border border-gray-300 p-2 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="会場名">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-600 mb-1">URL</label>
          <input type="url" name="URL" class="w-full border border-gray-300 p-2 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="https://...">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-600 mb-1">申し込み締め切り</label>
          <input type="date" name="申し込み締め切り" class="w-full border border-gray-300 p-2 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-600 mb-1">枠数</label>
          <input type="number" name="枠数" class="w-full border border-gray-300 p-2 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="5">
        </div>
        <div class="sm:col-span-2 flex justify-end space-x-2 pt-2 border-t mt-2">
          <button type="button" onclick="toggleForm()" class="bg-gray-100 hover:bg-gray-200 text-gray-600 px-4 py-2 rounded-lg text-sm font-semibold">キャンセル</button>
          <button type="submit" class="bg-green-600 hover:bg-green-700 text-white px-5 py-2 rounded-lg text-sm font-bold shadow-sm">スプレッドシートに追加</button>
        </div>
      </form>
    </div>

    <div id="loading" class="text-center text-gray-500 my-12 text-sm font-medium animate-pulse">データを読み込み中...</div>

    <div id="event-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
  </div>

  <script>
    // ⚠️ ここにご自身のGASウェブアプリのURLを貼り付け
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwseOQ37SQ_9l7AL6yIaGeuZ7K79yndwdZ6VUxFVIAGQKdy9SJS3IvY3EGpxf0HT0uh/exec";

    function toggleForm() {
      document.getElementById('add-form-container').classList.toggle('hidden');
    }

    function parseNumberCell(cellValue) {
      if (!cellValue || cellValue === "null" || cellValue === "undefined") return { num: "", status: "自分使用" };
      const str = String(cellValue).trim();
      if (str.includes(":")) {
        const parts = str.split(":");
        return { num: parts[0], status: parts[1] };
      }
      return { num: str, status: "自分使用" };
    }

    // 1. データ取得と画面描画
    async function fetchEvents() {
      const loadingEl = document.getElementById('loading');
      const listEl = document.getElementById('event-list');
      loadingEl.style.display = 'block';
      listEl.innerHTML = '';

      try {
        const response = await fetch(GAS_API_URL);
        const data = await response.json();

        // 💡 時差バグを100%引き起こさない、最強の「文字分解型」日付パース関数
        const parseToPureDate = (dateStr) => {
          if (!dateStr || dateStr === "null" || dateStr === "undefined" || String(dateStr).trim() === "") return null;
          try {
            // "2026-06-11T15:00:00.000Z" や "2026/06/11" から日付の数字だけを抜き出す
            let cleanStr = String(dateStr).split('T')[0].replace(/\//g, '-');
            if (cleanStr.includes('年')) {
              cleanStr = cleanStr.replace('年', '-').replace('月', '-').replace('日', '');
            }
            
            const parts = cleanStr.split('-');
            if (parts.length < 2) return null;

            let year = parts.length === 3 ? parseInt(parts[0], 10) : new Date().getFullYear();
            let month = parts.length === 3 ? parseInt(parts[1], 10) : parseInt(parts[0], 10);
            let day = parts.length === 3 ? parseInt(parts[2], 10) : parseInt(parts[1], 10);

            // ⚠️ 自動変換（new Date("strings")）を使わず、数字を直接指定して「ローカル（日本）時間」で組み立てる
            // これにより、時差で1日戻る現象が完全に防げます
            const d = new Date(year, month - 1, day, 0, 0, 0, 0);
            if (isNaN(d.getTime())) return null;
            return d;
          } catch (e) {
            return null;
          }
        };

        // 基準となる「今日」と「明日」をローカル時間で生成
        const today = new Date();
        today.setHours(0, 0, 0, 0);

        const tomorrow = new Date();
        tomorrow.setDate(today.getDate() + 1);
        tomorrow.setHours(0, 0, 0, 0);

        // 表示用の日本語表記「XXXX年XX月XX日」を作る関数
        const formatToJapaneseDate = (dateStr) => {
          const d = parseToPureDate(dateStr);
          if (!d) return '未設定';
          return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日`;
        };

        // 二段階ソート
        const sortedData = data.sort((a, b) => {
          const aDate = parseToPureDate(a.申し込み締め切り);
          const bDate = parseToPureDate(b.申し込み締め切り);

          const aIsUrgent = aDate && (aDate.getTime() === today.getTime() || aDate.getTime() === tomorrow.getTime());
          const bIsUrgent = bDate && (bDate.getTime() === today.getTime() || bDate.getTime() === tomorrow.getTime());

          if (aIsUrgent && bIsUrgent) return aDate.getTime() - bDate.getTime();
          if (aIsUrgent && !bIsUrgent) return -1;
          if (!aIsUrgent && bIsUrgent) return 1;

          const aHold = parseToPureDate(a.開催日);
          const bHold = parseToPureDate(b.開催日);
          const aTime = aHold ? aHold.getTime() : 9999999999999;
          const bTime = bHold ? bHold.getTime() : 9999999999999;
          return aTime - bTime;
        });

        loadingEl.style.display = 'none';

        sortedData.forEach(event => {
          const deadlineDateObj = parseToPureDate(event.申し込み締め切り);
          const isToday = deadlineDateObj && deadlineDateObj.getTime() === today.getTime();
          const isTomorrow = deadlineDateObj && deadlineDateObj.getTime() === tomorrow.getTime();
          const isUrgent = isToday || isTomorrow;

          const borderClass = isUrgent ? "border-2 border-red-500 bg-red-50/20" : "border border-gray-200 bg-white";

          const p1 = parseNumberCell(event.番号1);
          const p2 = parseNumberCell(event.番号2);

          const displayNumbers = [p1, p2]
            .filter(p => p.num !== "")
            .map(p => `${p.num}(${p.status.replace('使用','').replace('み','')})`)
            .join(", ");

          const displayHoldingDate = formatToJapaneseDate(event.開催日);
          const displayDeadlineDate = formatToJapaneseDate(event.申し込み締め切り);

          // コピペ用の「月日〆」を計算
          let mmddDeadline = "（締切未設定）";
          if (deadlineDateObj) {
            const m = String(deadlineDateObj.getMonth() + 1).padStart(2, '0');
            const d = String(deadlineDateObj.getDate()).padStart(2, '0');
            mmddDeadline = `${m}/${d}〆`;
          }

          const copyText = `${displayHoldingDate}\n${event.イベント名 || '未設定'}\n${event.会場 || '未設定'}\n${event.URL || 'URLなし'}\n${mmddDeadline}`;

          const card = document.createElement('div');
          card.className = `${borderClass} p-5 rounded-2xl shadow-sm flex flex-col justify-between space-y-4 relative transition hover:shadow-md`;
          
          card.innerHTML = `
            <div>
              <div class="flex justify-between items-start mb-3 pr-10">
                <span class="text-[11px] font-bold bg-indigo-50 text-indigo-700 px-2.5 py-1 rounded-md border border-indigo-100">${displayHoldingDate}</span>
                ${event.申し込み締め切り ? `
                  <span class="text-[11px] font-bold ${isUrgent ? 'bg-red-600 text-white' : 'bg-red-50 text-red-700 border border-red-100'} px-2.5 py-1 rounded-md">
                    ${isToday ? '⚠️ 今日締切！' : isTomorrow ? '⏳ 明日締切！' : '締切: ' + displayDeadlineDate}
                  </span>
                ` : ''}
              </div>

              <button onclick="copyToClipboard(\`${copyText.replace(/`/g, '\\`').replace(/\$/g, '\\$')}\`)" class="absolute top-5 right-4 bg-white hover:bg-gray-50 text-gray-500 hover:text-gray-800 p-1.5 rounded-lg border border-gray-200 transition shadow-sm" title="情報をコピー">
                📋
              </button>

              <h2 class="text-base font-bold text-gray-900 mb-1.5 leading-snug">${isUrgent ? '🔥 ' : ''}${event.イベント名 || '未設定'}</h2>
              <p class="text-xs text-gray-500 mb-3 flex items-center">📍 ${event.会場 || '未設定'} <span class="mx-2 text-gray-300">|</span> 枠: ${event.枠数 || '-'}</p>
              
              ${event.URL ? `
                <div class="text-[11px] bg-blue-50/50 border border-blue-100 p-2 rounded-lg mb-4">
                  <span class="font-bold block text-blue-800 mb-0.5">🔗 公式URL:</span>
                  <a href="${event.URL}" target="_blank" class="text-blue-600 hover:underline break-all block font-medium">${event.URL}</a>
                </div>
              ` : ''}
              
              <div class="bg-gray-50/80 border border-gray-100 p-3 rounded-xl text-xs mb-4 space-y-2">
                <div class="flex justify-between items-center">
                  <span class="font-bold text-gray-500">管理番号:</span>
                  <span class="font-semibold text-gray-800">${displayNumbers || '未入力'}</span>
                </div>
                
                <div id="inline-edit-${event.id}-nums" class="hidden space-y-3 pt-2.5 border-t border-gray-200">
                  <div class="space-y-1">
                    <input type="text" id="edit-${event.id}-num1" value="${p1.num}" placeholder="番号1" class="border border-gray-300 p-1.5 rounded-md w-full bg-white text-xs">
                    <select id="edit-${event.id}-status1" class="border border-gray-300 p-1.5 rounded-md w-full bg-white text-xs text-gray-700">
                      <option value="自分使用" ${p1.status === "自分使用" ? "selected" : ""}>自分使用</option>
                      <option value="譲渡前" ${p1.status === "譲渡前" ? "selected" : ""}>譲渡前</option>
                      <option value="譲渡済み" ${p1.status === "譲渡済み" ? "selected" : ""}>譲渡済み</option>
                    </select>
                  </div>
                  <div class="space-y-1 border-t border-gray-100 pt-2.5">
                    <input type="text" id="edit-${event.id}-num2" value="${p2.num}" placeholder="番号2" class="border border-gray-300 p-1.5 rounded-md w-full bg-white text-xs">
                    <select id="edit-${event.id}-status2" class="border border-gray-300 p-1.5 rounded-md w-full bg-white text-xs text-gray-700">
                      <option value="自分使用" ${p2.status === "undefined" || p2.status === "自分使用" ? "selected" : ""}>自分使用</option>
                      <option value="譲渡前" ${p2.status === "譲渡前" ? "selected" : ""}>譲渡前</option>
                      <option value="譲渡済み" ${p2.status === "譲渡済み" ? "selected" : ""}>譲渡済み</option>
                    </select>
                  </div>
                </div>
                
                <div class="flex justify-between items-center pt-1">
                  <button onclick="toggleInlineEdit('${event.id}-nums')" class="text-blue-600 hover:text-blue-700 font-medium hover:underline">✏️ 番号と分類を修正</button>
                  <button onclick="saveMultipleNumbersWithStatus(${event.id})" id="save-${event.id}-nums" class="hidden bg-blue-600 hover:bg-blue-700 text-white px-3 py-1 rounded-md font-bold shadow-sm">保存</button>
                </div>
              </div>
            </div>

            <div class="border-t border-gray-100 pt-3.5 space-y-2.5 text-xs text-gray-700 font-medium">
              <label class="flex items-center space-x-2.5 cursor-pointer hover:bg-gray-50 p-1 rounded transition">
                <input type="checkbox" ${event.リマインド ? 'checked' : ''} onchange="updateCell(${event.id}, 'リマインド', this.checked)" class="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500">
                <span>🔔 リマインドしたか</span>
              </label>

              <label class="flex items-center space-x-2.5 cursor-pointer hover:bg-gray-50 p-1 rounded transition">
                <input type="checkbox" ${event.申し込み済み ? 'checked' : ''} onchange="updateCell(${event.id}, '申し込み済み', this.checked)" class="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500">
                <span>✅ 申し込み済み</span>
              </label>

              <div class="flex items-center justify-between border-t border-gray-100 pt-2.5 mt-1.5">
                <label class="flex items-center space-x-2.5 cursor-pointer hover:bg-gray-50 p-1 rounded transition flex-1">
                  <input type="checkbox" ${event.なゆ参戦か ? 'checked' : ''} onchange="updateCell(${event.id}, 'なゆ参戦か', this.checked)" class="w-4 h-4 text-pink-600 border-gray-300 rounded focus:ring-pink-500">
                  <span>なゆ参戦</span>
                </label>
                <div class="flex items-center space-x-1.5">
                  <span class="text-[11px] text-gray-400 font-bold">番:</span>
                  <input type="text" id="input-nayunum-${event.id}" value="${event.番号なゆ || ''}" onchange="updateCell(${event.id}, '番号なゆ', this.value)" class="border border-gray-300 w-16 p-1 text-center rounded-md bg-gray-50 focus:bg-white focus:ring-1 focus:ring-pink-500 focus:outline-none font-semibold text-gray-800">
                </div>
              </div>

              <div class="flex items-center justify-between">
                <label class="flex items-center space-x-2.5 cursor-pointer hover:bg-gray-50 p-1 rounded transition flex-1">
                  <input type="checkbox" ${event.そると参戦か ? 'checked' : ''} onchange="updateCell(${event.id}, 'そると参戦か', this.checked)" class="w-4 h-4 text-green-600 border-gray-300 rounded focus:ring-green-500">
                  <span>そると参戦</span>
                </label>
                <div class="flex items-center space-x-1.5">
                  <span class="text-[11px] text-gray-400 font-bold">番:</span>
                  <input type="text" id="input-soltnum-${event.id}" value="${event.番号そると || ''}" onchange="updateCell(${event.id}, '番号そると', this.value)" class="border border-gray-300 w-16 p-1 text-center rounded-md bg-gray-50 focus:bg-white focus:ring-1 focus:ring-green-500 focus:outline-none font-semibold text-gray-800">
                </div>
              </div>
            </div>
          `;
          listEl.appendChild(card);
        });
      } catch (error) {
        loadingEl.textContent = "データの読み込みに失敗しました。";
        console.error(error);
      }
    }

    function copyToClipboard(text) {
      navigator.clipboard.writeText(text).then(() => {
        alert("📋 情報をコピーしました！");
      }).catch(err => {
        const textarea = document.createElement("textarea");
        textarea.value = text;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand("copy");
        document.body.removeChild(textarea);
        alert("📋 情報をコピーしました！");
      });
    }

    function toggleInlineEdit(idKey) {
      document.getElementById(`inline-edit-${idKey}`).classList.toggle('hidden');
      document.getElementById(`save-${idKey}`).classList.toggle('hidden');
    }

    async function saveMultipleNumbersWithStatus(rowId) {
      const n1 = document.getElementById(`edit-${rowId}-num1`).value;
      const s1 = document.getElementById(`edit-${rowId}-status1`).value;
      const val1 = n1 ? `${n1}:${s1}` : "";

      const n2 = document.getElementById(`edit-${rowId}-num2`).value;
      const s2 = document.getElementById(`edit-${rowId}-status2`).value;
      const val2 = n2 ? `${n2}:${s2}` : "";

      await updateCell(rowId, '番号1', val1);
      await updateCell(rowId, '番号2', val2);
      
      alert("番号と分類を更新しました！");
      fetchEvents();
    }

    async function updateCell(rowId, columnName, value) {
      const payload = { id: rowId, column: columnName, value: value };
      try {
        await fetch(GAS_API_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
      } catch (error) {
        console.error("更新エラー:", error);
      }
    }

    async function addEvent(e) {
      e.preventDefault();
      const form = e.target;
      const formData = new FormData(form);
      const payload = {
        action: "insert",
        開催日: formData.get("開催日"),
        イベント名: formData.get("イベント名"),
        会場: formData.get("会場"),
        URL: formData.get("URL"),
        申し込み締め切り: formData.get("申し込み締め切り"),
        枠数: formData.get("枠数")
      };

      try {
        await fetch(GAS_API_URL, { method: "POST", mode: "no-cors", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
        alert("新規イベントを追加しました！");
        form.reset();
        toggleForm();
        fetchEvents();
      } catch (error) {
        alert("追加に失敗しました。");
      }
    }

    window.onload = fetchEvents;
  </script>
</body>
</html>

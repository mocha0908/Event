<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>イベント・チケット管理</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', 'Noto Sans JP', sans-serif; letter-spacing: -0.01em; }
  </style>
</head>
<body class="bg-[#fafafa] min-h-screen text-gray-900 antialiased">

  <div class="max-w-6xl mx-auto px-4 py-12 sm:px-6">
    
    <header class="mb-12 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b border-gray-200 pb-6">
      <div>
        <h1 class="text-xl font-bold text-gray-900 tracking-tight">イベント・チケット管理</h1>
        <p class="text-xs text-gray-400 mt-1">締切が近いものを最上位に自動ソートしています</p>
      </div>
      
      <div class="flex items-center gap-2 w-full sm:w-auto">
        <button onclick="toggleForm('add-form-container')" class="flex-1 sm:flex-none bg-gray-900 hover:bg-gray-800 text-white px-4 py-2 rounded-lg font-medium text-xs transition duration-150">
          イベント追加
        </button>
        <button onclick="toggleForm('member-manager-container')" class="flex-1 sm:flex-none bg-white hover:bg-gray-50 text-gray-600 px-4 py-2 rounded-lg font-medium text-xs border border-gray-200 transition duration-150">
          参戦者の管理
        </button>
        <button onclick="fetchEvents()" class="bg-white hover:bg-gray-50 text-gray-400 p-2 rounded-lg border border-gray-200 transition duration-150" title="更新">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 1121.253 8H18"></path></svg>
        </button>
      </div>
    </header>

    <div id="member-manager-container" class="hidden bg-white border border-gray-200 rounded-xl shadow-sm p-5 mb-8 max-w-md mx-auto">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-xs font-bold text-gray-800 tracking-wider uppercase">参戦メンバーの設定</h2>
        <button onclick="toggleForm('member-manager-container')" class="text-gray-400 hover:text-gray-600 text-xs">✕</button>
      </div>
      <div class="flex gap-2 mb-4">
        <input type="text" id="new-member-name" placeholder="名前を入力" class="flex-1 bg-gray-50 border border-gray-200 p-2 rounded-lg text-xs focus:outline-none focus:border-gray-400">
        <button onclick="addMember()" class="bg-gray-900 text-white px-3 py-2 rounded-lg text-xs font-medium">追加</button>
      </div>
      <div id="manager-member-list" class="flex flex-wrap gap-1.5 p-2 bg-gray-50 rounded-lg min-h-[40px]"></div>
    </div>

    <div id="add-form-container" class="hidden bg-white border border-gray-200 rounded-xl shadow-sm p-6 mb-8 max-w-xl mx-auto">
      <h2 class="text-xs font-bold text-gray-800 tracking-wider uppercase mb-4">新規イベント登録</h2>
      <form id="add-event-form" onsubmit="addEvent(event)" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-[10px] font-bold text-gray-400 uppercase mb-1">開催日</label>
          <input type="date" name="開催日" required class="w-full bg-gray-50 border border-gray-200 p-2 rounded-lg text-xs focus:outline-none focus:border-gray-400">
        </div>
        <div>
          <label class="block text-[10px] font-bold text-gray-400 uppercase mb-1">イベント名</label>
          <input type="text" name="イベント名" required class="w-full bg-gray-50 border border-gray-200 p-2 rounded-lg text-xs focus:outline-none focus:border-gray-400" placeholder="公演名">
        </div>
        <div>
          <label class="block text-[10px] font-bold text-gray-400 uppercase mb-1">会場</label>
          <input type="text" name="会場" class="w-full bg-gray-50 border border-gray-200 p-2 rounded-lg text-xs focus:outline-none focus:border-gray-400" placeholder="会場名">
        </div>
        <div>
          <label class="block text-[10px] font-bold text-gray-400 uppercase mb-1">URL</label>
          <input type="url" name="URL" class="w-full bg-gray-50 border border-gray-200 p-2 rounded-lg text-xs focus:outline-none focus:border-gray-400" placeholder="https://...">
        </div>
        <div>
          <label class="block text-[10px] font-bold text-gray-400 uppercase mb-1">申し込み締め切り</label>
          <input type="date" name="申し込み締め切り" class="w-full bg-gray-50 border border-gray-200 p-2 rounded-lg text-xs focus:outline-none focus:border-gray-400">
        </div>
        <div>
          <label class="block text-[10px] font-bold text-gray-400 uppercase mb-1">枠数</label>
          <input type="number" name="枠数" class="w-full bg-gray-50 border border-gray-200 p-2 rounded-lg text-xs focus:outline-none focus:border-gray-400">
        </div>
        <div class="sm:col-span-2 flex justify-end space-x-2 pt-3 border-t border-gray-100 mt-2">
          <button type="button" onclick="toggleForm('add-form-container')" class="text-gray-400 px-3 py-1.5 rounded-lg text-xs">キャンセル</button>
          <button type="submit" class="bg-gray-900 text-white px-4 py-1.5 rounded-lg text-xs font-medium">登録</button>
        </div>
      </form>
    </div>

    <div id="loading" class="my-24 text-center">
      <div class="inline-block w-4 h-4 border-2 border-gray-300 border-t-gray-800 rounded-full animate-spin mb-2"></div>
      <p class="text-xs text-gray-400">データを読み込み中</p>
    </div>

    <div id="event-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
  </div>

  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwseOQ37SQ_9l7AL6yIaGeuZ7K79yndwdZ6VUxFVIAGQKdy9SJS3IvY3EGpxf0HT0uh/exec";

    let members = JSON.parse(localStorage.getItem('ticket_hub_members')) || ["なゆ", "そると"];

    function toggleForm(id) {
      document.getElementById(id).classList.toggle('hidden');
      if (id === 'member-manager-container') renderManagerMemberList();
    }

    function renderManagerMemberList() {
      const wrapper = document.getElementById('manager-member-list');
      wrapper.innerHTML = '';
      if(members.length === 0) {
        wrapper.innerHTML = '<span class="text-[11px] text-gray-400 p-2">登録なし</span>';
        return;
      }
      members.forEach((m, idx) => {
        const badge = document.createElement('div');
        badge.className = "flex items-center gap-1.5 bg-white text-gray-700 text-xs px-2.5 py-1 rounded-md border border-gray-200 shadow-sm";
        badge.innerHTML = `
          <span>${m}</span>
          <button onclick="deleteMember(${idx})" class="text-gray-300 hover:text-red-500 font-bold ml-1">✕</button>
        `;
        wrapper.appendChild(badge);
      });
    }

    function addMember() {
      const input = document.getElementById('new-member-name');
      const name = input.value.trim();
      if (!name) return;
      if (members.includes(name)) return;
      members.push(name);
      localStorage.setItem('ticket_hub_members', JSON.stringify(members));
      input.value = '';
      renderManagerMemberList();
      fetchEvents();
    }

    function deleteMember(index) {
      members.splice(index, 1);
      localStorage.setItem('ticket_hub_members', JSON.stringify(members));
      renderManagerMemberList();
      fetchEvents();
    }

    function parseNumberCell(cellValue) {
      if (!cellValue || cellValue === "null" || cellValue === "undefined") return { num: "", status: "自分使用" };
      const str = String(cellValue).trim();
      if (str.includes(":")) {
        const parts = str.split(":");
        return { num: parts[0], status: parts[1] };
      }
      return { num: str, status: "自分使用" };
    }

    async function fetchEvents() {
      const loadingEl = document.getElementById('loading');
      const listEl = document.getElementById('event-list');
      loadingEl.style.display = 'block';
      listEl.innerHTML = '';

      try {
        const response = await fetch(GAS_API_URL);
        const data = await response.json();

        const parseToPureDate = (dateStr) => {
          if (!dateStr || dateStr === "null" || dateStr === "undefined" || String(dateStr).trim() === "") return null;
          try {
            const rawStr = String(dateStr);
            if (rawStr.includes('T')) {
              const parts = rawStr.split('T');
              const dParts = parts[0].split('-');
              const d = new Date(parseInt(dParts[0],10), parseInt(dParts[1],10) - 1, parseInt(dParts[2],10), 0,0,0,0);
              if (parts[1] && parts[1].startsWith('15:')) d.setDate(d.getDate() + 1);
              return d;
            }
            let cleanStr = rawStr.replace(/\//g, '-');
            if (cleanStr.includes('年')) cleanStr = cleanStr.replace('年', '-').replace('月', '-').replace('日', '');
            const dParts = cleanStr.split('-');
            if (dParts.length < 2) return null;
            return new Date(dParts.length === 3 ? parseInt(dParts[0],10) : new Date().getFullYear(), (dParts.length === 3 ? parseInt(dParts[1],10) : parseInt(dParts[0],10)) - 1, dParts.length === 3 ? parseInt(dParts[2],10) : parseInt(dParts[1],10), 0,0,0,0);
          } catch (e) { return null; }
        };

        const today = new Date(); today.setHours(0,0,0,0);
        const tomorrow = new Date(); tomorrow.setDate(today.getDate() + 1); tomorrow.setHours(0,0,0,0);

        const formatToJapaneseDate = (dateStr) => {
          const d = parseToPureDate(dateStr);
          if (!d) return '日程未定';
          return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日`;
        };

        const sortedData = data.sort((a, b) => {
          const aDate = parseToPureDate(a.申し込み締め切り);
          const bDate = parseToPureDate(b.申し込み締め切り);
          const aIsUrgent = aDate && (aDate.getTime() === today.getTime() || aDate.getTime() === tomorrow.getTime());
          const bIsUrgent = bDate && (bDate.getTime() === today.getTime() || bDate.getTime() === tomorrow.getTime());
          if (aIsUrgent && bIsUrgent) return aDate.getTime() - bDate.getTime();
          if (aIsUrgent && !bIsUrgent) return -1;
          if (!aIsUrgent && bIsUrgent) return 1;
          const aHold = parseToPureDate(a.開催日); const bHold = parseToPureDate(b.開催日);
          return (aHold ? aHold.getTime() : 9999999999999) - (bHold ? bHold.getTime() : 9999999999999);
        });

        loadingEl.style.display = 'none';

        sortedData.forEach(event => {
          const deadlineDateObj = parseToPureDate(event.申し込み締め切り);
          const isToday = deadlineDateObj && deadlineDateObj.getTime() === today.getTime();
          const isTomorrow = deadlineDateObj && deadlineDateObj.getTime() === tomorrow.getTime();
          const isUrgent = isToday || isTomorrow;

          // ─── 静かで上品なデザイン分け ───
          let cardClass = "bg-white border border-gray-200";
          let badgeClass = "bg-gray-100 text-gray-600";
          if (isUrgent) {
            cardClass = "bg-white border-2 border-red-500 shadow-sm";
            badgeClass = "bg-red-50 text-red-600 font-medium";
          }

          const p1 = parseNumberCell(event.番号1);
          const p2 = parseNumberCell(event.番号2);
          const displayNumbers = [p1, p2].filter(p => p.num !== "").map(p => `${p.num}(${p.status.replace('使用','').replace('み','')})`).join(", ");

          const displayHoldingDate = formatToJapaneseDate(event.開催日);
          const displayDeadlineDate = formatToJapaneseDate(event.申し込み締め切り);

          let mmddDeadline = "（未設定）";
          if (deadlineDateObj) {
            mmddDeadline = `${String(deadlineDateObj.getMonth() + 1).padStart(2, '0')}/${String(deadlineDateObj.getDate()).padStart(2, '0')}〆`;
          }

          const copyText = `${displayHoldingDate}\n${event.イベント名 || '未設定'}\n${event.会場 || '未設定'}\n${event.URL || 'URLなし'}\n${mmddDeadline}`;

          let dynamicMembersHTML = '';
          members.forEach(m => {
            const checkKey = `${m}参戦か`;
            const numKey = `番号${m}`;
            const isChecked = event[checkKey] ? 'checked' : '';
            const numVal = event[numKey] || '';

            dynamicMembersHTML += `
              <div class="flex items-center justify-between border-b border-gray-50 py-1.5 last:border-none">
                <label class="flex items-center space-x-2 cursor-pointer flex-1">
                  <input type="checkbox" ${isChecked} onchange="updateCell(${event.id}, '${checkKey}', this.checked)" class="w-3.5 h-3.5 rounded text-gray-900 border-gray-300 focus:ring-gray-900">
                  <span class="text-xs text-gray-600">${m}</span>
                </label>
                <div class="flex items-center space-x-1">
                  <span class="text-[10px] text-gray-400">番:</span>
                  <input type="text" value="${numVal}" onchange="updateCell(${event.id}, '${numKey}', this.value)" class="border border-gray-200 bg-gray-50 w-14 p-0.5 text-center rounded text-xs text-gray-700 focus:border-gray-400 focus:outline-none">
                </div>
              </div>
            `;
          });

          const card = document.createElement('div');
          card.className = `${cardClass} p-5 rounded-xl flex flex-col justify-between space-y-4 relative`;
          
          card.innerHTML = `
            <div>
              <div class="flex justify-between items-start mb-3 pr-8">
                <span class="text-[10px] text-gray-400 font-medium tracking-tight">${displayHoldingDate}</span>
                ${event.申し込み締め切り ? `
                  <span class="text-[10px] px-2 py-0.5 rounded ${badgeClass}">
                    ${isToday ? '今日締切' : isTomorrow ? '明日締切' : '締切: ' + displayDeadlineDate}
                  </span>
                ` : ''}
              </div>

              <button onclick="copyToClipboard(\`${copyText.replace(/`/g, '\\`').replace(/\$/g, '\\$')}\`)" class="absolute top-4 right-4 text-gray-300 hover:text-gray-600 transition" title="コピー">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg>
              </button>

              <h2 class="text-sm font-bold text-gray-900 mb-1 leading-snug">${event.イベント名 || '未設定'}</h2>
              <p class="text-xs text-gray-400">📍 ${event.会場 || '未設定'} <span class="mx-1.5 text-gray-200">|</span> 枠: ${event.枠数 || '-'}</p>
              
              ${event.URL ? `
                <div class="text-[11px] mt-3 pt-2.5 border-t border-gray-100">
                  <a href="${event.URL}" target="_blank" class="text-blue-600 hover:underline break-all block font-medium">チケットリンク →</a>
                </div>
              ` : ''}
              
              <div class="bg-gray-50 p-2.5 rounded-lg text-xs mt-4 space-y-1.5">
                <div class="flex justify-between items-center">
                  <span class="text-[10px] text-gray-400">管理番号</span>
                  <span class="font-medium text-gray-800">${displayNumbers || '未入力'}</span>
                </div>
                
                <div id="inline-edit-${event.id}-nums" class="hidden space-y-2 pt-2 border-t border-gray-200">
                  <div class="flex gap-1.5">
                    <input type="text" id="edit-${event.id}-num1" value="${p1.num}" placeholder="番号1" class="bg-white border border-gray-200 p-1 rounded w-full text-xs">
                    <select id="edit-${event.id}-status1" class="bg-white border border-gray-200 p-1 rounded text-xs text-gray-600">
                      <option value="自分使用" ${p1.status === "自分使用" ? "selected" : ""}>自分使用</option>
                      <option value="譲渡前" ${p1.status === "譲渡前" ? "selected" : ""}>譲渡前</option>
                      <option value="譲渡済み" ${p1.status === "譲渡済み" ? "selected" : ""}>譲渡済み</option>
                    </select>
                  </div>
                  <div class="flex gap-1.5">
                    <input type="text" id="edit-${event.id}-num2" value="${p2.num}" placeholder="番号2" class="bg-white border border-gray-200 p-1 rounded w-full text-xs">
                    <select id="edit-${event.id}-status2" class="bg-white border border-gray-200 p-1 rounded text-xs text-gray-600">
                      <option value="自分使用" ${p2.status === "undefined" || p2.status === "自分使用" ? "selected" : ""}>自分使用</option>
                      <option value="譲渡前" ${p2.status === "譲渡前" ? "selected" : ""}>譲渡前</option>
                      <option value="譲渡済み" ${p2.status === "譲渡済み" ? "selected" : ""}>譲渡済み</option>
                    </select>
                  </div>
                </div>
                
                <div class="flex justify-between items-center pt-0.5">
                  <button onclick="toggleInlineEdit('${event.id}-nums')" class="text-gray-400 hover:text-gray-600 text-[10px]">編集</button>
                  <button onclick="saveMultipleNumbersWithStatus(${event.id})" id="save-${event.id}-nums" class="hidden bg-gray-900 text-white px-2 py-0.5 rounded text-[10px]">保存</button>
                </div>
              </div>
            </div>

            <div class="border-t border-gray-100 pt-3 space-y-1.5">
              <label class="flex items-center space-x-2 cursor-pointer py-0.5">
                <input type="checkbox" ${event.リマインド ? 'checked' : ''} onchange="updateCell(${event.id}, 'リマインド', this.checked)" class="w-3.5 h-3.5 rounded text-gray-900 border-gray-300 focus:ring-gray-900">
                <span class="text-xs text-gray-600">リマインド通知</span>
              </label>

              <label class="flex items-center space-x-2 cursor-pointer py-0.5">
                <input type="checkbox" ${event.申し込み済み ? 'checked' : ''} onchange="updateCell(${event.id}, '申し込み済み', this.checked)" class="w-3.5 h-3.5 rounded text-gray-900 border-gray-300 focus:ring-gray-900">
                <span class="text-xs text-gray-600">本申し込み完了</span>
              </label>

              <div class="pt-2 mt-1 border-t border-gray-100">
                ${dynamicMembersHTML}
              </div>
            </div>
          `;
          listEl.appendChild(card);
        });
      } catch (error) {
        loadingEl.textContent = "同期エラーが発生しました。";
        console.error(error);
      }
    }

    function copyToClipboard(text) {
      navigator.clipboard.writeText(text).then(() => {
        alert("コピーしました");
      }).catch(err => {
        const textarea = document.createElement("textarea");
        textarea.value = text; document.body.appendChild(textarea); textarea.select();
        document.execCommand("copy"); document.body.removeChild(textarea);
        alert("コピーしました");
      });
    }

    function toggleInlineEdit(idKey) {
      document.getElementById(`inline-edit-${idKey}`).classList.toggle('hidden');
      document.getElementById(`save-${idKey}`).classList.toggle('hidden');
    }

    async function saveMultipleNumbersWithStatus(rowId) {
      const n1 = document.getElementById(`edit-${rowId}-num1`).value;
      const s1 = document.getElementById(`edit-${rowId}-status1`).value;
      await updateCell(rowId, '番号1', n1 ? `${n1}:${s1}` : "");
      const n2 = document.getElementById(`edit-${rowId}-num2`).value;
      const s2 = document.getElementById(`edit-${rowId}-status2`).value;
      await updateCell(rowId, '番号2', n2 ? `${n2}:${s2}` : "");
      alert("保存しました");
      fetchEvents();
    }

    async function updateCell(rowId, columnName, value) {
      const payload = { id: rowId, column: columnName, value: value };
      try {
        await fetch(GAS_API_URL, { method: "POST", mode: "no-cors", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
      } catch (error) { console.error(error); }
    }

    async function addEvent(e) {
      e.preventDefault();
      const form = e.target; const formData = new FormData(form);
      const payload = {
        action: "insert",
        開催日: formData.get("開催日"),
        イベント名: formData.get("イベント名"),
        会場: formData.get("会場"),
        URL: formData.get("URL"),
        申し込み締め切り: formData.get("申し込み締め切り"),
        枠数: formData.get("枠数")
      };
      try {
        await fetch(GAS_API_URL, { method: "POST", mode: "no-cors", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
        alert("追加しました");
        form.reset(); toggleForm('add-form-container'); fetchEvents();
      } catch (error) { alert("失敗しました"); }
    }

    window.onload = fetchEvents;
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>イベント・チケット管理</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', 'Noto Sans JP', sans-serif; letter-spacing: -0.01em; -webkit-overflow-scrolling: touch; }
    
    /* 締切間近カードの緊迫感あるアニメーション効果 */
    @keyframes pulse-border {
      0% { border-color: rgba(239, 68, 68, 0.5); box-shadow: 0 4px 20px rgba(239, 68, 68, 0.08); }
      50% { border-color: rgba(239, 68, 68, 1); box-shadow: 0 4px 25px rgba(239, 68, 68, 0.18); }
      100% { border-color: rgba(239, 68, 68, 0.5); box-shadow: 0 4px 20px rgba(239, 68, 68, 0.08); }
    }
    .urgent-card {
      animation: pulse-border 2.5s infinite ease-in-out;
    }
  </style>
</head>
<body class="bg-[#f8fafc] min-h-screen text-slate-900 antialiased">

  <div class="max-w-6xl mx-auto px-4 py-8 sm:px-6">
    
    <header class="mb-8 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b border-slate-200 pb-5">
      <div>
        <h1 class="text-2xl font-bold text-slate-900 tracking-tight flex items-center gap-2">
          <span>🎫</span> Ticket Hub
        </h1>
        <p class="text-xs text-slate-400 mt-1">スケジュールと申し込み締め切りを一元管理</p>
      </div>
      
      <div class="flex items-center gap-2 w-full sm:w-auto">
        <button onclick="toggleForm('add-form-container')" class="flex-1 sm:flex-none bg-slate-900 hover:bg-slate-800 text-white px-4 py-2.5 rounded-xl font-semibold text-xs tracking-wide transition duration-150 shadow-sm">
          ＋ イベント追加
        </button>
        <button onclick="toggleForm('member-manager-container')" class="flex-1 sm:flex-none bg-white hover:bg-slate-50 text-slate-600 px-4 py-2.5 rounded-xl font-medium text-xs border border-slate-200 transition duration-150 shadow-sm">
          👥 メンバー設定
        </button>
        <button onclick="fetchEvents(true)" class="bg-white hover:bg-slate-50 text-slate-400 p-2.5 rounded-xl border border-slate-200 transition duration-150 shadow-sm" title="手動更新">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 1121.253 8H18"></path></svg>
        </button>
      </div>
    </header>

    <div id="member-manager-container" class="hidden bg-white border border-slate-200 rounded-2xl shadow-xl p-5 mb-8 max-w-md mx-auto">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-xs font-bold text-slate-400 tracking-wider uppercase">参戦メンバーの設定</h2>
        <button onclick="toggleForm('member-manager-container')" class="text-slate-400 hover:text-slate-600 text-sm">✕</button>
      </div>
      <div class="flex gap-2 mb-4">
        <input type="text" id="new-member-name" placeholder="名前を入力" class="flex-1 bg-slate-50 border border-slate-200 p-2.5 rounded-xl text-xs focus:outline-none focus:border-slate-400 focus:bg-white transition">
        <button onclick="addMember()" class="bg-slate-900 text-white px-4 py-2.5 rounded-xl text-xs font-semibold">追加</button>
      </div>
      <div id="manager-member-list" class="flex flex-wrap gap-1.5 p-2 bg-slate-50 rounded-xl min-h-[46px]"></div>
    </div>

    <div id="add-form-container" class="hidden bg-white border border-slate-200 rounded-2xl shadow-xl p-6 mb-8 max-w-xl mx-auto">
      <h2 class="text-xs font-bold text-slate-400 tracking-wider uppercase mb-5">新規イベント登録</h2>
      <form id="add-event-form" onsubmit="addEvent(event)" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">開催日</label>
          <input type="date" name="開催日" required class="w-full bg-slate-50 border border-slate-200 p-2.5 rounded-xl text-xs focus:outline-none focus:border-slate-400 focus:bg-white transition">
        </div>
        <div>
          <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">イベント名</label>
          <input type="text" name="イベント名" required class="w-full bg-slate-50 border border-slate-200 p-2.5 rounded-xl text-xs focus:outline-none focus:border-slate-400 focus:bg-white transition" placeholder="ツアー名・公演名">
        </div>
        <div>
          <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">会場</label>
          <input type="text" name="会場" class="w-full bg-slate-50 border border-slate-200 p-2.5 rounded-xl text-xs focus:outline-none focus:border-slate-400 focus:bg-white transition" placeholder="会場名">
        </div>
        <div>
          <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">URL</label>
          <input type="url" name="URL" class="w-full bg-slate-50 border border-slate-200 p-2.5 rounded-xl text-xs focus:outline-none focus:border-slate-400 focus:bg-white transition" placeholder="https://...">
        </div>
        <div>
          <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">申し込み締め切り</label>
          <input type="date" name="申し込み締め切り" class="w-full bg-slate-50 border border-slate-200 p-2.5 rounded-xl text-xs focus:outline-none focus:border-slate-400 focus:bg-white transition">
        </div>
        <div>
          <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">枠数</label>
          <input type="number" name="枠数" class="w-full bg-slate-50 border border-slate-200 p-2.5 rounded-xl text-xs focus:outline-none focus:border-slate-400 focus:bg-white transition" placeholder="1">
        </div>
        <div class="sm:col-span-2 flex justify-end space-x-2 pt-4 border-t border-slate-100 mt-2">
          <button type="button" onclick="toggleForm('add-form-container')" class="text-slate-400 hover:text-slate-600 px-4 py-2 rounded-xl text-xs font-medium">キャンセル</button>
          <button type="submit" class="bg-slate-900 hover:bg-slate-800 text-white px-5 py-2 rounded-xl text-xs font-semibold shadow-sm">登録する</button>
        </div>
      </form>
    </div>

    <div id="sync-indicator" class="fixed bottom-6 right-6 bg-slate-900/95 text-white text-[11px] font-medium px-4 py-2 rounded-full shadow-xl transition-opacity duration-300 opacity-0 pointer-events-none flex items-center gap-2 z-50">
      <div class="w-2.5 h-2.5 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
      Cloudと同期中...
    </div>

    <div id="loading" class="my-32 text-center hidden">
      <div class="inline-block w-6 h-6 border-2 border-slate-200 border-t-slate-800 rounded-full animate-spin mb-3"></div>
      <p class="text-xs font-medium text-slate-400 tracking-wider">最新データをロード中</p>
    </div>

    <div id="view-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>

  </div>

  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwseOQ37SQ_9l7AL6yIaGeuZ7K79yndwdZ6VUxFVIAGQKdy9SJS3IvY3EGpxf0HT0uh/exec";

    let members = JSON.parse(localStorage.getItem('ticket_hub_members')) || ["なゆ", "そると"];
    let globalEventsRaw = JSON.parse(localStorage.getItem('ticket_hub_events_cache')) || [];
    let localEditingNumbers = {};

    function getJstTodayString() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const d = String(now.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    // スラッシュ区切りで安全に日本時間として日付を生成する
    const parseToPureDate = (dateStr) => {
      if (!dateStr || dateStr === "null" || dateStr === "undefined" || String(dateStr).trim() === "") return null;
      try {
        let rawStr = String(dateStr);
        if (rawStr.includes('T')) rawStr = rawStr.split('T')[0];
        let cleanStr = rawStr.replace(/-/g, '/');
        if (cleanStr.includes('年')) cleanStr = cleanStr.replace('年', '/').replace('月', '/').replace('日', '');
        const dParts = cleanStr.split('/');
        if (dParts.length < 2) return null;
        return new Date(dParts.length === 3 ? parseInt(dParts[0],10) : new Date().getFullYear(), (dParts.length === 3 ? parseInt(dParts[1],10) : parseInt(dParts[0],10)) - 1, dParts.length === 3 ? parseInt(dParts[2],10) : parseInt(dParts[1],10), 0,0,0,0);
      } catch (e) { return null; }
    };

    function toggleForm(id) {
      document.getElementById(id).classList.toggle('hidden');
      if (id === 'member-manager-container') renderManagerMemberList();
    }

    function renderManagerMemberList() {
      const wrapper = document.getElementById('manager-member-list');
      wrapper.innerHTML = '';
      if(members.length === 0) {
        wrapper.innerHTML = '<span class="text-xs text-slate-400 p-2">登録メンバーなし</span>';
        return;
      }
      members.forEach((m, idx) => {
        const badge = document.createElement('div');
        badge.className = "flex items-center gap-1.5 bg-white text-slate-700 text-xs px-3 py-1 rounded-lg border border-slate-200 shadow-sm font-medium";
        badge.innerHTML = `
          <span>${m}</span>
          <button onclick="deleteMember(${idx})" class="text-slate-300 hover:text-red-500 font-bold ml-1">✕</button>
        `;
        wrapper.appendChild(badge);
      });
    }

    function addMember() {
      const input = document.getElementById('new-member-name');
      const name = input.value.trim();
      if (!name || members.includes(name)) return;
      members.push(name);
      localStorage.setItem('ticket_hub_members', JSON.stringify(members));
      input.value = '';
      renderManagerMemberList();
      fetchEvents(true);
    }

    function deleteMember(index) {
      members.splice(index, 1);
      localStorage.setItem('ticket_hub_members', JSON.stringify(members));
      renderManagerMemberList();
      fetchEvents(true);
    }

    function parseNumbersString(cellValue) {
      if (!cellValue || cellValue === "null" || cellValue === "undefined" || String(cellValue).trim() === "") return [];
      const rawStr = String(cellValue).trim();
      if (!rawStr.includes(';;') && rawStr.includes(':') && rawStr.split(':').length === 2) {
        const p = rawStr.split(':');
        return [{ label: "番号1", num: p[0], status: p[1] }];
      }
      const items = rawStr.split(';;'); const result = [];
      items.forEach(item => {
        const parts = item.split(':');
        if (parts.length >= 2) result.push({ label: parts[0] || "番号", num: parts[1] || "", status: parts[2] || "自分使用" });
      });
      return result;
    }

    async function fetchEvents(forceWithSpinner = false) {
      const loadingEl = document.getElementById('loading');
      const indicatorEl = document.getElementById('sync-indicator');
      
      if (globalEventsRaw.length > 0 && !forceWithSpinner) {
        renderListView();
        indicatorEl.classList.remove('opacity-0');
      } else {
        loadingEl.classList.remove('hidden');
      }
      
      try {
        const response = await fetch(GAS_API_URL);
        const latestData = await response.json();
        globalEventsRaw = latestData;
        localStorage.setItem('ticket_hub_events_cache', JSON.stringify(latestData));
        renderListView();
      } catch (error) {
        console.error("同期失敗:", error);
      } finally {
        loadingEl.classList.add('hidden');
        indicatorEl.classList.add('opacity-0');
      }
    }

    function renderListView() {
      const listEl = document.getElementById('view-list');
      listEl.innerHTML = '';

      if (globalEventsRaw.length === 0) {
        listEl.innerHTML = '<div class="col-span-full text-center py-20 text-xs text-slate-400 font-medium">登録されているイベントがありません。</div>';
        return;
      }

      const jstTodayStr = getJstTodayString();
      const p = jstTodayStr.split('-');
      const today = new Date(parseInt(p[0],10), parseInt(p[1],10)-1, parseInt(p[2],10), 0,0,0,0);
      
      const tomorrow = new Date(today); tomorrow.setDate(today.getDate() + 1);
      const yesterday = new Date(today); yesterday.setDate(today.getDate() - 1);

      const formatToJapaneseDate = (dateStr) => {
        const d = parseToPureDate(dateStr);
        if (!d) return '日程未定';
        return `${d.getFullYear()}/${String(d.getMonth() + 1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;
      };

      // 締め切り順にソート（今日・明日などの緊急予定を最上位へ）
      const sortedData = [...globalEventsRaw].sort((a, b) => {
        const aDate = parseToPureDate(a.申し込み締め切り);
        const bDate = parseToPureDate(b.申し込み締め切り);
        const aUrgent = aDate && (aDate.getTime() === yesterday.getTime() || aDate.getTime() === today.getTime() || aDate.getTime() === tomorrow.getTime());
        const bUrgent = bDate && (bDate.getTime() === yesterday.getTime() || bDate.getTime() === today.getTime() || bDate.getTime() === tomorrow.getTime());
        
        if (aUrgent && bUrgent) return aDate.getTime() - bDate.getTime();
        if (aUrgent && !bUrgent) return -1;
        if (!aUrgent && bUrgent) return 1;
        
        const aHold = parseToPureDate(a.開催日); const bHold = parseToPureDate(b.開催日);
        return (aHold ? aHold.getTime() : 9999999999999) - (bHold ? bHold.getTime() : 9999999999999);
      });

      sortedData.forEach(event => {
        const deadlineDateObj = parseToPureDate(event.申し込み締め切り);
        const isYesterday = deadlineDateObj && deadlineDateObj.getTime() === yesterday.getTime();
        const isToday = deadlineDateObj && deadlineDateObj.getTime() === today.getTime();
        const isTomorrow = deadlineDateObj && deadlineDateObj.getTime() === tomorrow.getTime();
        const isUrgent = isYesterday || isToday || isTomorrow;

        // スタイリッシュなベースカード定義
        let cardClass = "bg-white border border-slate-200 shadow-sm";
        let badgeClass = "bg-slate-100 text-slate-600";
        
        if (isUrgent) {
          cardClass = "bg-white border-2 border-red-500 urgent-card shadow-md";
          badgeClass = "bg-red-500 text-white font-bold animate-pulse";
        }

        const displayHoldingDate = formatToJapaneseDate(event.開催日);
        const displayDeadlineDate = formatToJapaneseDate(event.申し込み締め切り);

        let mmddDeadline = "（未設定）";
        if (deadlineDateObj) {
          mmddDeadline = `${String(deadlineDateObj.getMonth() + 1).padStart(2, '0')}/${String(deadlineDateObj.getDate()).padStart(2, '0')} 〆`;
        }

        const copyText = `${displayHoldingDate}\n${event.イベント名 || '未設定'}\n${event.会場 || '未設定'}\n${event.URL || 'URLなし'}\n${mmddDeadline}`;

        if (!localEditingNumbers[event.id]) {
          const parsed = parseNumbersString(event.番号1);
          localEditingNumbers[event.id] = parsed.length > 0 ? parsed : [{ label: "番号1", num: "", status: "自分使用" }];
        }

        const displayNumbersText = localEditingNumbers[event.id]
          .filter(p => p.num !== "")
          .map(p => `${p.label}:${p.num}(${p.status.replace('使用','').replace('み','')})`)
          .join(", ");

        let dynamicMembersHTML = '';
        members.forEach(m => {
          const checkKey = `${m}参戦か`; const numKey = `番号${m}`;
          const isChecked = event[checkKey] ? 'checked' : '';
          const numVal = event[numKey] || '';

          dynamicMembersHTML += `
            <div class="flex items-center justify-between py-2 border-b border-slate-100/60 last:border-none">
              <label class="flex items-center space-x-2.5 cursor-pointer flex-1 select-none">
                <input type="checkbox" ${isChecked} onchange="updateCell(${event.id}, '${checkKey}', this.checked)" class="w-4 h-4 rounded-md text-slate-900 border-slate-300 focus:ring-slate-900 transition">
                <span class="text-xs font-medium text-slate-600">${m}</span>
              </label>
              <div class="flex items-center space-x-1">
                <span class="text-[10px] font-bold text-slate-300 uppercase">No.</span>
                <input type="text" value="${numVal}" onchange="updateCell(${event.id}, '${numKey}', this.value)" class="border border-slate-200 bg-slate-50/50 w-16 p-1 text-center rounded-lg text-xs font-medium text-slate-700 focus:border-slate-400 focus:bg-white focus:outline-none transition">
              </div>
            </div>
          `;
        });

        let badgeText = '締切: ' + displayDeadlineDate;
        if (isYesterday) badgeText = '⚠️ 昨日締切！';
        if (isToday) badgeText = '🚨 本日締切！';
        if (isTomorrow) badgeText = '⏳ 明日締切';

        const card = document.createElement('div');
        card.id = `event-card-${event.id}`;
        card.className = `${cardClass} p-6 rounded-2xl flex flex-col justify-between space-y-5 relative hover:shadow-md transition duration-200`;
        
        card.innerHTML = `
          <div>
            <div class="flex justify-between items-center mb-3 pr-8">
              <div class="flex items-center gap-1.5 text-[11px] font-semibold text-slate-400">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                <span>${displayHoldingDate}</span>
              </div>
              ${event.申し込み締め切り ? `
                <span class="text-[10px] px-2.5 py-1 rounded-full font-bold tracking-wider ${badgeClass}">
                  ${badgeText}
                </span>
              ` : ''}
            </div>

            <button onclick="copyToClipboard(\`${copyText.replace(/`/g, '\\`').replace(/\$/g, '\\$')}\`)" class="absolute top-5 right-5 text-slate-300 hover:text-slate-600 transition p-1" title="情報をコピー">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg>
            </button>

            <h2 class="text-base font-bold text-slate-900 mb-1.5 leading-snug tracking-tight">${event.イベント名 || '未設定'}</h2>
            
            <div class="flex flex-wrap items-center gap-x-3 gap-y-1 text-xs text-slate-400 font-medium">
              <span class="inline-flex items-center gap-1">📍 ${event.会場 || '未設定'}</span>
              <span class="text-slate-200">|</span>
              <span>枠数: <strong class="text-slate-600 font-semibold">${event.枠数 || '-'}</strong></span>
            </div>
            
            ${event.URL ? `
              <div class="mt-4">
                <a href="${event.URL}" target="_blank" class="inline-flex items-center text-xs font-semibold text-blue-600 hover:text-blue-700 bg-blue-50/50 hover:bg-blue-50 px-3 py-1.5 rounded-xl transition">
                  チケットリンク 
                  <svg class="w-3 h-3 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                </a>
              </div>
            ` : ''}
            
            <div class="bg-slate-50 border border-slate-100 rounded-xl p-3 text-xs mt-4 space-y-2">
              <div class="flex justify-between items-start">
                <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mt-0.5">管理番号</span>
                <span class="font-semibold text-slate-700 text-right max-w-[190px] break-words">${displayNumbersText || '未入力'}</span>
              </div>
              
              <div id="inline-edit-${event.id}-nums" class="hidden space-y-2 pt-2.5 border-t border-slate-200/60">
                <div id="edit-inputs-list-${event.id}"></div>
                <button onclick="addNewRowToCard(${event.id})" class="text-[10px] font-semibold text-blue-600 hover:underline block pt-1">＋ 項目を追加</button>
              </div>
              
              <div class="flex justify-between items-center pt-1">
                <button onclick="toggleCardEdit(${event.id})" class="text-slate-400 hover:text-slate-600 font-medium text-[10px] transition">管理番号を編集</button>
                <button onclick="saveCardNumbers(${event.id})" id="save-${event.id}-nums" class="hidden bg-slate-900 hover:bg-slate-800 text-white px-2.5 py-1 rounded-lg text-[10px] font-semibold shadow-sm transition">保存</button>
              </div>
            </div>
          </div>

          <div class="border-t border-slate-100 pt-4 space-y-1">
            <div class="grid grid-cols-2 gap-2 mb-3">
              <label class="flex items-center space-x-2 cursor-pointer bg-slate-50/60 p-2 rounded-xl border border-slate-100 select-none">
                <input type="checkbox" ${event.リマインド ? 'checked' : ''} onchange="updateCell(${event.id}, 'リマインド', this.checked)" class="w-4 h-4 rounded-md text-slate-900 border-slate-300 focus:ring-slate-900 transition">
                <span class="text-xs font-medium text-slate-600">通知ON</span>
              </label>

              <label class="flex items-center space-x-2 cursor-pointer bg-slate-50/60 p-2 rounded-xl border border-slate-100 select-none">
                <input type="checkbox" ${event.申し込み済み ? 'checked' : ''} onchange="updateCell(${event.id}, '申し込み済み', this.checked)" class="w-4 h-4 rounded-md text-slate-900 border-slate-300 focus:ring-slate-900 transition">
                <span class="text-xs font-medium text-slate-600">申込完了</span>
              </label>
            </div>

            <div class="bg-slate-50/30 border border-slate-100 rounded-xl px-3 py-1">
              ${dynamicMembersHTML}
            </div>
          </div>
        `;
        listEl.appendChild(card);
      });
    }

    function toggleCardEdit(rowId) {
      const container = document.getElementById(`inline-edit-${rowId}-nums`);
      const saveBtn = document.getElementById(`save-${rowId}-nums`);
      const isHidden = container.classList.contains('hidden');
      container.classList.toggle('hidden');
      saveBtn.classList.toggle('hidden');
      if (isHidden) renderEditRows(rowId);
    }

    function renderEditRows(rowId) {
      const listContainer = document.getElementById(`edit-inputs-list-${rowId}`);
      listContainer.innerHTML = '';
      
      localEditingNumbers[rowId].forEach((item, idx) => {
        const row = document.createElement('div');
        row.className = "flex gap-1.5 items-center mb-2";
        row.innerHTML = `
          <input type="text" value="${item.label}" oninput="localEditingNumbers[${rowId}][${idx}].label=this.value" placeholder="項目名" class="bg-white border border-slate-200 p-1.5 rounded-lg w-16 text-[10px] text-slate-500 font-bold focus:outline-none focus:border-slate-400">
          <input type="text" value="${item.num}" oninput="localEditingNumbers[${rowId}][${idx}].num=this.value" placeholder="番号" class="bg-white border border-slate-200 p-1.5 rounded-lg flex-1 text-xs focus:outline-none focus:border-slate-400">
          <select onchange="localEditingNumbers[${rowId}][${idx}].status=this.value" class="bg-white border border-slate-200 p-1.5 rounded-lg text-xs text-slate-600 font-medium focus:outline-none">
            <option value="自分使用" ${item.status === "自分使用" ? "selected" : ""}>自分使用</option>
            <option value="譲渡前" ${item.status === "譲渡前" ? "selected" : ""}>譲渡前</option>
            <option value="譲渡済み" ${item.status === "譲渡済み" ? "selected" : ""}>譲渡済み</option>
          </select>
          <button onclick="removeRowFromCard(${rowId}, ${idx})" class="text-slate-300 hover:text-red-500 font-bold px-1 transition">✕</button>
        `;
        listContainer.appendChild(row);
      });
    }

    function addNewRowToCard(rowId) {
      const currentRows = localEditingNumbers[rowId] || [];
      const nextIndex = currentRows.length + 1;
      currentRows.push({ label: `番号${nextIndex}`, num: "", status: "自分使用" });
      localEditingNumbers[rowId] = currentRows;
      renderEditRows(rowId);
    }

    function removeRowFromCard(rowId, index) {
      localEditingNumbers[rowId].splice(index, 1);
      renderEditRows(rowId);
    }

    async function saveCardNumbers(rowId) {
      const rows = localEditingNumbers[rowId] || [];
      const packagedString = rows
        .filter(r => r.label.trim() !== "")
        .map(r => `${r.label.replace(/:|;/g, '')}:${r.num.replace(/:|;/g, '')}:${r.status}`)
        .join(';;');

      const idx = globalEventsRaw.findIndex(ev => ev.id == rowId);
      if(idx !== -1) globalEventsRaw[idx]['番号1'] = packagedString;
      localStorage.setItem('ticket_hub_events_cache', JSON.stringify(globalEventsRaw));

      await updateCell(rowId, '番号1', packagedString);
      alert("管理番号を保存しました");
      fetchEvents();
    }

    function copyToClipboard(text) {
      navigator.clipboard.writeText(text).then(() => {
        alert("クリップボードにコピーしました！");
      }).catch(err => {
        const textarea = document.createElement("textarea");
        textarea.value = text; document.body.appendChild(textarea); textarea.select();
        document.execCommand("copy"); document.body.removeChild(textarea);
        alert("クリップボードにコピーしました！");
      });
    }

    async function updateCell(rowId, columnName, value) {
      const idx = globalEventsRaw.findIndex(ev => ev.id == rowId);
      if(idx !== -1) globalEventsRaw[idx][columnName] = value;
      localStorage.setItem('ticket_hub_events_cache', JSON.stringify(globalEventsRaw));

      const payload = { id: rowId, column: columnName, value: value };
      try {
        await fetch(GAS_API_URL, { method: "POST", mode: "no-cors", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
      } catch (error) { console.error(error); }
    }

    async function addEvent(e) {
      e.preventDefault();
      const form = e.target; const formData = new FormData(form);
      const payload = {
        action: "insert",
        開催日: formData.get("開催日"),
        イベント名: formData.get("イベント名"),
        会場: formData.get("会場"),
        URL: formData.get("URL"),
        申し込み締め切り: formData.get("申し込み締め切り"),
        枠数: formData.get("枠数")
      };
      try {
        await fetch(GAS_API_URL, { method: "POST", mode: "no-cors", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
        alert("イベントを新しく登録しました！");
        form.reset(); toggleForm('add-form-container'); 
        fetchEvents(true);
      } catch (error) { alert("登録に失敗しました"); }
    }

    window.onload = () => {
      fetchEvents(false);
    };
  </script>
</body>
</html>

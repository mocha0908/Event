<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>イベント・チケ管理アプリ（診断モード）</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen p-4 md:p-8 text-gray-800">

  <div class="max-w-6xl mx-auto">
    <header class="mb-8 border-b border-gray-200 pb-5">
      <h1 class="text-2xl font-bold text-gray-900 tracking-tight">📅 イベント・チケ管理（診断中）</h1>
      <p class="text-xs text-red-600 mt-1 font-bold">⚠️ 日付バグの原因を突き止めるための診断用コードです</p>
    </header>

    <div id="loading" class="text-center text-gray-500 my-12 text-sm font-medium animate-pulse">データを読み込み中...</div>

    <div id="event-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-12"></div>

    <div class="bg-gray-900 text-green-400 p-5 rounded-xl font-mono text-xs overflow-x-auto shadow-inner">
      <h3 class="text-white font-bold mb-3 border-b border-gray-700 pb-2">🚨 【診断ログ】GASから届いている実際の日付データ</h3>
      <p class="text-gray-400 mb-2">※ここを見て、GASが日付をどう送ってきているか100%特定します</p>
      <div id="debug-log" class="space-y-1"></div>
    </div>
  </div>

  <script>
    // ⚠️ ここにご自身のGASウェブアプリのURLを貼り付け
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwseOQ37SQ_9l7AL6yIaGeuZ7K79yndwdZ6VUxFVIAGQKdy9SJS3IvY3EGpxf0HT0uh/exec";

    function parseNumberCell(cellValue) {
      if (!cellValue || cellValue === "null" || cellValue === "undefined") return { num: "", status: "自分使用" };
      const str = String(cellValue).trim();
      if (str.includes(":")) {
        const parts = str.split(":");
        return { num: parts[0], status: parts[1] };
      }
      return { num: str, status: "自分使用" };
    }

    async function fetchEvents() {
      const loadingEl = document.getElementById('loading');
      const listEl = document.getElementById('event-list');
      const debugLog = document.getElementById('debug-log');
      
      loadingEl.style.display = 'block';
      listEl.innerHTML = '';
      debugLog.innerHTML = '';

      try {
        const response = await fetch(GAS_API_URL);
        const data = await response.json();

        // 💡 画面下に生データを書き出す
        data.forEach((event, idx) => {
          const div = document.createElement('div');
          div.innerHTML = `[イベント ${idx + 1}] 名前: <span class="text-white">${event.イベント名 || '未設定'}</span> | 締め切りデータ: <span class="text-yellow-300 font-bold">"${event.申し込み締め切り}"</span> (型: ${typeof event.申し込み締め切り})`;
          debugLog.appendChild(div);
        });

        // 簡易パース関数
        const parseToPureDate = (dateStr) => {
          if (!dateStr || dateStr === "null" || dateStr === "undefined" || String(dateStr).trim() === "") return null;
          try {
            let cleanStr = String(dateStr).split('T')[0].replace(/\//g, '-');
            if (cleanStr.includes('年')) {
              cleanStr = cleanStr.replace('年', '-').replace('月', '-').replace('日', '');
            }
            const parts = cleanStr.split('-');
            if (parts.length < 2) return null;
            let year = parts.length === 3 ? parseInt(parts[0], 10) : new Date().getFullYear();
            let month = parts.length === 3 ? parseInt(parts[1], 10) : parseInt(parts[0], 10);
            let day = parts.length === 3 ? parseInt(parts[2], 10) : parseInt(parts[1], 10);
            return new Date(year, month - 1, day, 0, 0, 0, 0);
          } catch (e) {
            return null;
          }
        };

        const today = new Date(); today.setHours(0,0,0,0);
        const tomorrow = new Date(); tomorrow.setDate(today.getDate() + 1); tomorrow.setHours(0,0,0,0);

        const formatToJapaneseDate = (dateStr) => {
          const d = parseToPureDate(dateStr);
          if (!d) return '未設定';
          return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日`;
        };

        // ソート
        const sortedData = data.sort((a, b) => {
          const aDate = parseToPureDate(a.申し込み締め切り);
          const bDate = parseToPureDate(b.申し込み締め切り);
          const aIsUrgent = aDate && (aDate.getTime() === today.getTime() || aDate.getTime() === tomorrow.getTime());
          const bIsUrgent = bDate && (bDate.getTime() === today.getTime() || bDate.getTime() === tomorrow.getTime());
          if (aIsUrgent && bIsUrgent) return aDate.getTime() - bDate.getTime();
          if (aIsUrgent && !bIsUrgent) return -1;
          if (!aIsUrgent && bIsUrgent) return 1;
          const aHold = parseToPureDate(a.開催日); const bHold = parseToPureDate(b.開催日);
          const aTime = aHold ? aHold.getTime() : 9999999999999; const bTime = bHold ? bHold.getTime() : 9999999999999;
          return aTime - bTime;
        });

        loadingEl.style.display = 'none';

        sortedData.forEach(event => {
          const deadlineDateObj = parseToPureDate(event.申し込み締め切り);
          const isToday = deadlineDateObj && deadlineDateObj.getTime() === today.getTime();
          const isTomorrow = deadlineDateObj && deadlineDateObj.getTime() === tomorrow.getTime();
          const isUrgent = isToday || isTomorrow;

          const borderClass = isUrgent ? "border-2 border-red-500 bg-red-50/20" : "border border-gray-200 bg-white";
          const p1 = parseNumberCell(event.番号1); const p2 = parseNumberCell(event.番号2);
          const displayNumbers = [p1, p2].filter(p => p.num !== "").map(p => `${p.num}(${p.status.replace('使用','').replace('み','')})`).join(", ");
          const displayHoldingDate = formatToJapaneseDate(event.開催日);
          const displayDeadlineDate = formatToJapaneseDate(event.申し込み締め切り);

          const card = document.createElement('div');
          card.className = `${borderClass} p-5 rounded-2xl shadow-sm relative`;
          card.innerHTML = `
            <div class="flex justify-between items-start mb-2">
              <span class="text-[11px] font-bold bg-indigo-50 text-indigo-700 px-2 py-0.5 rounded">${displayHoldingDate}</span>
              <span class="text-[11px] font-bold ${isUrgent ? 'bg-red-600 text-white' : 'bg-gray-100 text-gray-700'} px-2 py-0.5 rounded">
                ${isToday ? '⚠️ 今日締切！' : isTomorrow ? '⏳ 明日締切！' : '締切: ' + displayDeadlineDate}
              </span>
            </div>
            <h2 class="text-sm font-bold text-gray-900 mb-1">${event.イベント名 || '未設定'}</h2>
            <p class="text-xs text-gray-500">📍 ${event.会場 || '未設定'}</p>
          `;
          listEl.appendChild(card);
        });
      } catch (error) {
        loadingEl.textContent = "データの読み込みに失敗しました。";
        console.error(error);
      }
    }

    window.onload = fetchEvents;
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>イベント・チケ管理アプリ</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4 md:p-8">

  <div class="max-w-6xl mx-auto">
    <header class="mb-8 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
      <h1 class="text-2xl font-bold text-gray-800">📅 イベント・チケ管理</h1>
      <div class="flex space-x-2">
        <button onclick="toggleForm()" class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded shadow transition font-semibold">
          ＋ イベント追加
        </button>
        <button onclick="fetchEvents()" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded shadow transition">
          🔄 更新
        </button>
      </div>
    </header>

    <div id="add-form-container" class="hidden bg-white p-6 rounded-xl shadow-md border border-gray-200 mb-8 max-w-2xl mx-auto">
      <h2 class="text-lg font-bold text-gray-800 mb-4">🆕 新しいイベントの追加</h2>
      <form id="add-event-form" onsubmit="addEvent(event)" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">開催日 *</label>
          <input type="date" name="開催日" required class="w-full border p-2 rounded text-sm">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">イベント名 *</label>
          <input type="text" name="イベント名" required class="w-full border p-2 rounded text-sm" placeholder="ライブ・公演名">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">会場</label>
          <input type="text" name="会場" class="w-full border p-2 rounded text-sm" placeholder="会場名">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">URL</label>
          <input type="url" name="URL" class="w-full border p-2 rounded text-sm" placeholder="https://...">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">申し込み締め切り</label>
          <input type="date" name="申し込み締め切り" class="w-full border p-2 rounded text-sm">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">枠数</label>
          <input type="number" name="枠数" class="w-full border p-2 rounded text-sm" placeholder="5">
        </div>
        <div class="sm:col-span-2 flex justify-end space-x-2 pt-2">
          <button type="button" onclick="toggleForm()" class="bg-gray-300 text-gray-700 px-4 py-2 rounded text-sm">キャンセル</button>
          <button type="submit" class="bg-green-500 text-white px-4 py-2 rounded text-sm font-bold shadow">スプレッドシートに追加</button>
        </div>
      </form>
    </div>

    <div id="loading" class="text-center text-gray-500 my-8">データを読み込み中...</div>

    <div id="event-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
  </div>

  <script>
    // ⚠️ ここにご自身のGASウェブアプリのURLを貼り付け
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwseOQ37SQ_9l7AL6yIaGeuZ7K79yndwdZ6VUxFVIAGQKdy9SJS3IvY3EGpxf0HT0uh/exec";

    function toggleForm() {
      document.getElementById('add-form-container').classList.toggle('hidden');
    }

    // セルデータから「番号」と「ステータス」を切り分ける
    function parseNumberCell(cellValue) {
      if (!cellValue || cellValue === "null" || cellValue === "undefined") return { num: "", status: "自分使用" };
      const str = String(cellValue);
      if (str.includes(":")) {
        const parts = str.split(":");
        return { num: parts[0], status: parts[1] };
      }
      return { num: str, status: "自分使用" };
    }

    // 1. データ取得と画面描画
    async function fetchEvents() {
      const loadingEl = document.getElementById('loading');
      const listEl = document.getElementById('event-list');
      loadingEl.style.display = 'block';
      listEl.innerHTML = '';

      try {
        const response = await fetch(GAS_API_URL);
        const data = await response.json();

        const getJstDateString = (dateObj) => {
          const y = dateObj.getFullYear();
          const m = String(dateObj.getMonth() + 1).padStart(2, '0');
          const d = String(dateObj.getDate()).padStart(2, '0');
          return `${y}-${m}-${d}`;
        };

        const now = new Date();
        const todayStr = getJstDateString(now);
        const tomorrow = new Date();
        tomorrow.setDate(now.getDate() + 1);
        const tomorrowStr = getJstDateString(tomorrow);

        // 日付を「XXXX年XX月XX日」に変換する
        const formatToJapaneseDate = (dateStr) => {
          if (!dateStr || dateStr === "null" || dateStr === "undefined") return '未設定';
          if (typeof dateStr === 'string' && dateStr.includes('年')) return dateStr;

          const normalizedStr = String(dateStr).replace(/\//g, '-');
          const parts = normalizedStr.split('-');
          
          if (parts.length !== 3) return '未設定';
          
          const year = parts[0];
          const month = Number(parts[1]);
          const day = Number(parts[2]);

          if (isNaN(month) || isNaN(day)) return '未設定';
          return `${year}年${month}月${day}日`;
        };

        // 締切優先の二段階ソート
        const sortedData = data.sort((a, b) => {
          const aIsUrgent = (a.申し込み締め切り === todayStr || a.申し込み締め切り === tomorrowStr);
          const bIsUrgent = (b.申し込み締め切り === todayStr || b.申し込み締め切り === tomorrowStr);

          if (aIsUrgent && bIsUrgent) {
            return new Date(a.申し込み締め切り) - new Date(b.申し込み締め切り);
          }
          if (aIsUrgent && !bIsUrgent) return -1;
          if (!aIsUrgent && bIsUrgent) return 1;

          return new Date(a.開催日) - new Date(b.開催日);
        });

        loadingEl.style.display = 'none';

        sortedData.forEach(event => {
          const isUrgent = (event.申し込み締め切り === todayStr || event.申し込み締め切り === tomorrowStr);
          const borderClass = isUrgent ? "border-2 border-red-500 bg-red-50/30" : "border-gray-200 bg-white";

          const p1 = parseNumberCell(event.番号1);
          const p2 = parseNumberCell(event.番号2);
          const p3 = parseNumberCell(event.番号3);

          const displayNumbers = [p1, p2, p3]
            .filter(p => p.num !== "")
            .map(p => `${p.num}(${p.status.replace('使用','').replace('み','')})`)
            .join(", ");

          const displayHoldingDate = formatToJapaneseDate(event.開催日);
          const displayDeadlineDate = formatToJapaneseDate(event.申し込み締め切り);

          const card = document.createElement('div');
          card.className = `${borderClass} p-5 rounded-xl shadow-md flex flex-col justify-between space-y-4 relative`;
          
          // 💡 JavaScript用：コピペ用の「月日〆」を計算する処理
          let mmddDeadline = "（締切未設定）";
          if (event.申し込み締め切り && event.申し込み締め切り !== "null") {
            const parts = event.申し込み締め切り.replace(/\//g, '-').split('-');
            if (parts.length === 3) {
              mmddDeadline = `${parts[1].padStart(2, '0')}/${parts[2].padStart(2, '0')}〆`;
            }
          }

          // ボタン引数用に、改行をエスケープした安全なテキストを仕込む
          const copyText = `${displayHoldingDate}\n${event.イベント名 || '未設定'}\n${event.会場 || '未設定'}\n${event.URL || 'URLなし'}\n${mmddDeadline}`;

          card.innerHTML = `
            <div>
              <div class="flex justify-between items-start mb-2 pr-16">
                <span class="text-xs font-semibold bg-indigo-100 text-indigo-800 px-2 py-1 rounded">${displayHoldingDate}</span>
                ${event.申し込み締め切り ? `
                  <span class="text-[11px] font-bold ${isUrgent ? 'bg-red-600 text-white font-black' : 'bg-red-100 text-red-700'} px-2 py-1 rounded">
                    ${event.申し込み締め切り === todayStr ? '⚠️ 今日締切！' : event.申し込み締め切り === tomorrowStr ? '⏳ 明日締切！' : '締切: ' + displayDeadlineDate}
                  </span>
                ` : ''}
              </div>

              <button onclick="copyToClipboard(\`${copyText.replace(/`/g, '\\`').replace(/\$/g, '\\$')}\`)" class="absolute top-4 right-4 bg-gray-100 hover:bg-gray-200 text-gray-700 text-[11px] px-2 py-1 rounded border border-gray-300 font-bold transition shadow-sm">
                📋 コピペ用
              </button>

              <h2 class="text-lg font-bold text-gray-900 mb-1 mt-1">${isUrgent ? '🔥 ' : ''}${event.イベント名 || '未設定'}</h2>
              <p class="text-sm text-gray-600 mb-2">📍 ${event.会場 || '未設定'} (枠: ${event.枠数 || '-'})</p>
              
              ${event.URL ? `
                <div class="text-xs text-gray-500 mb-4">
                  <span class="font-bold block text-gray-600 mb-0.5">🔗 公式URL:</span>
                  <a href="${event.URL}" target="_blank" class="text-blue-600 hover:underline break-all block">${event.URL}</a>
                </div>
              ` : ''}
              
              <div class="bg-gray-50 p-3 rounded-lg text-sm mb-4 space-y-2">
                <div class="flex justify-between items-center">
                  <span class="font-bold text-gray-700">管理番号:</span>
                  <span class="text-xs font-medium text-gray-600">${displayNumbers || '未入力'}</span>
                </div>
                
                <div id="inline-edit-${event.id}-nums" class="hidden space-y-3 pt-2 border-t text-xs">
                  <div class="space-y-1">
                    <input type="text" id="edit-${event.id}-num1" value="${p1.num}" placeholder="番号1" class="border p-1 rounded w-full">
                    <select id="edit-${event.id}-status1" class="border p-1 rounded w-full bg-white">
                      <option value="自分使用" ${p1.status === "自分使用" ? "selected" : ""}>自分使用</option>
                      <option value="譲渡前" ${p1.status === "譲渡前" ? "selected" : ""}>譲渡前</option>
                      <option value="譲渡済み" ${p1.status === "譲渡済み" ? "selected" : ""}>譲渡済み</option>
                    </select>
                  </div>
                  <div class="space-y-1 border-t pt-2">
                    <input type="text" id="edit-${event.id}-num2" value="${p2.num}" placeholder="番号2" class="border p-1 rounded w-full">
                    <select id="edit-${event.id}-status2" class="border p-1 rounded w-full bg-white">
                      <option value="自分使用" ${p2.status === "undefined" || p2.status === "自分使用" ? "selected" : ""}>自分使用</option>
                      <option value="譲渡前" ${p2.status === "譲渡前" ? "selected" : ""}>譲渡前</option>
                      <option value="譲渡済み" ${p2.status === "譲渡済み" ? "selected" : ""}>譲渡済み</option>
                    </select>
                  </div>
                </div>
                
                <div class="flex justify-between items-center pt-1">
                  <button onclick="toggleInlineEdit('${event.id}-nums')" class="text-xs text-blue-500 hover:underline">✏️ 番号と分類を修正</button>
                  <button onclick="saveMultipleNumbersWithStatus(${event.id})" id="save-${event.id}-nums" class="hidden text-xs bg-blue-500 text-white px-3 py-1 rounded font-bold shadow">保存</button>
                </div>
              </div>
            </div>

            <div class="border-t pt-4 space-y-2 text-sm text-gray-700">
              <label class="flex items-center space-x-2 cursor-pointer">
                <input type="checkbox" ${event.リマインド ? 'checked' : ''} onchange="updateCell(${event.id}, 'リマインド', this.checked)" class="w-4 h-4 text-blue-600 rounded">
                <span>🔔 リマインドしたか</span>
              </label>

              <label class="flex items-center space-x-2 cursor-pointer">
                <input type="checkbox" ${event.申し込み済み ? 'checked' : ''} onchange="updateCell(${event.id}, '申し込み済み', this.checked)" class="w-4 h-4 text-blue-600 rounded">
                <span>✅ 申し込み済み</span>
              </label>

              <div class="flex items-center justify-between border-t pt-2 mt-2">
                <label class="flex items-center space-x-2 cursor-pointer">
                  <input type="checkbox" ${event.なゆ参戦か ? 'checked' : ''} onchange="updateCell(${event.id}, 'なゆ参戦か', this.checked)" class="w-4 h-4 text-pink-600 rounded">
                  <span>なゆ参戦</span>
                </label>
                <div class="flex items-center space-x-1">
                  <span class="text-xs text-gray-500">番:</span>
                  <input type="text" id="input-nayunum-${event.id}" value="${event.番号なゆ || ''}" onchange="updateCell(${event.id}, '番号なゆ', this.value)" class="border w-16 p-0.5 text-xs text-center rounded bg-gray-50 focus:bg-white">
                </div>
              </div>

              <div class="flex items-center justify-between">
                <label class="flex items-center space-x-2 cursor-pointer">
                  <input type="checkbox" ${event.そると参戦か ? 'checked' : ''} onchange="updateCell(${event.id}, 'そると参戦か', this.checked)" class="w-4 h-4 text-green-600 rounded">
                  <span>そると参戦</span>
                </label>
                <div class="flex items-center space-x-1">
                  <span class="text-xs text-gray-500">番:</span>
                  <input type="text" id="input-soltnum-${event.id}" value="${event.番号そると || ''}" onchange="updateCell(${event.id}, '番号そると', this.value)" class="border w-16 p-0.5 text-xs text-center rounded bg-gray-50 focus:bg-white">
                </div>
              </div>
            </div>
          `;
          listEl.appendChild(card);
        });
      } catch (error) {
        loadingEl.textContent = "データの読み込みに失敗しました。";
      }
    }

    // 💡 クリップボードへのコピーを行う関数
    function copyToClipboard(text) {
      navigator.clipboard.writeText(text).then(() => {
        alert("📋 情報をクリップボードにコピーしました！");
      }).catch(err => {
        // 万が一スマホの古いブラウザなどで古い書き方が必要な場合の予備
        const textarea = document.createElement("textarea");
        textarea.value = text;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand("copy");
        document.body.removeChild(textarea);
        alert("📋 情報をコピーしました！");
      });
    }

    function toggleInlineEdit(idKey) {
      document.getElementById(`inline-edit-${idKey}`).classList.toggle('hidden');
      document.getElementById(`save-${idKey}`).classList.toggle('hidden');
    }

    async function saveMultipleNumbersWithStatus(rowId) {
      const n1 = document.getElementById(`edit-${rowId}-num1`).value;
      const s1 = document.getElementById(`edit-${rowId}-status1`).value;
      const val1 = n1 ? `${n1}:${s1}` : "";

      const n2 = document.getElementById(`edit-${rowId}-num2`).value;
      const s2 = document.getElementById(`edit-${rowId}-status2`).value;
      const val2 = n2 ? `${n2}:${s2}` : "";

      await updateCell(rowId, '番号1', val1);
      await updateCell(rowId, '番号2', val2);
      
      alert("番号と分類を更新しました！");
      fetchEvents();
    }

    async function updateCell(rowId, columnName, value) {
      const payload = { id: rowId, column: columnName, value: value };
      try {
        await fetch(GAS_API_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
      } catch (error) {
        console.error("更新エラー:", error);
      }
    }

    async function addEvent(e) {
      e.preventDefault();
      const form = e.target;
      const formData = new FormData(form);
      const payload = {
        action: "insert",
        開催日: formData.get("開催日"),
        イベント名: formData.get("イベント名"),
        会場: formData.get("会場"),
        URL: formData.get("URL"),
        申し込み締め切り: formData.get("申し込み締め切り"),
        枠数: formData.get("枠数")
      };

      try {
        await fetch(GAS_API_URL, { method: "POST", mode: "no-cors", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
        alert("新規イベントを追加しました！");
        form.reset();
        toggleForm();
        fetchEvents();
      } catch (error) {
        alert("追加に失敗しました。");
      }
    }

    window.onload = fetchEvents;
  </script>
</body>
</html>
